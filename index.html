<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DOG MATRIX - AI Greyhound Predictor</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --panel-dark: #121829;
            --accent-green: #00ff66;
            --accent-blue: #00e5ff;
            --text-main: #f0f4f8;
            --text-muted: #8fa0dd;
            --border-color: #202b47;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--panel-dark); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: var(--accent-green); font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .config-box input { background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; width: 280px; }
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; flex: 1; }
        @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }
        .panel { background-color: var(--panel-dark); border-radius: 12px; border: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; }
        .panel-title { font-size: 16px; text-transform: uppercase; margin-bottom: 15px; color: var(--accent-blue); font-weight: bold; }
        textarea { width: 100%; flex: 1; min-height: 400px; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; resize: none; }
        .action-bar { margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { background: linear-gradient(135deg, #00ff66 0%, #00b347 100%); color: #000; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3); }
        button:disabled { background: #202b47; color: #556688; cursor: not-allowed; box-shadow: none; }
        .output-box { width: 100%; flex: 1; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.6; min-height: 400px; white-space: pre-wrap; }
        .output-box table { width: 100%; border-collapse: collapse; margin: 15px 0; background-color: var(--panel-dark); }
        .output-box th { background-color: var(--border-color); color: var(--accent-blue); padding: 10px; text-align: left; }
        .output-box td { padding: 10px; border-bottom: 1px solid var(--border-color); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body>

    <header>
        <h1>THE DOG MATRIX</h1>
        <div class="config-box">
            <input type="password" id="apiKey" placeholder="Incolla la tua API Key di Google Gemini..." />
        </div>
    </header>

    <div class="main-container">
        <div class="panel">
            <div class="panel-title">Dati Grezzi Racing Post</div>
            <textarea id="rawInput" placeholder="Incolla qui i dati della corsa..."></textarea>
            <div class="action-bar">
                <div id="statusOutput" style="color: var(--text-muted);">Pronto.</div>
                <button id="analyzeBtn">Elabora Pronostico</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Verdetto Operativo</div>
            <div id="aiOutput" class="output-box">Inserisci la chiave in alto, i dati a sinistra e clicca sul tasto verde.</div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/generative-ai";

        const apiKeyInput = document.getElementById('apiKey');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const rawInput = document.getElementById('rawInput');
        const statusOutput = document.getElementById('statusOutput');
        const aiOutput = document.getElementById('aiOutput');

        if (localStorage.getItem('gemini_api_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_api_key');
        }

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value);
        });

        analyzeBtn.addEventListener('click', async function() {
            const apiKey = apiKeyInput.value.trim();
            const rawData = rawInput.value.trim();

            if (!apiKey) {
                alert('Manca la chiave API in alto a destra!');
                return;
            }
            if (!rawData) {
                alert('Incolla i dati della corsa nel box di sinistra!');
                return;
            }

            analyzeBtn.disabled = true;
            statusOutput.textContent = 'Calcolo in corso...';
            aiOutput.textContent = 'L\'interfaccia sta interrogando i nodi dell\'intelligenza artificiale...';

            const promptTesto = "Sei un analista esperto di corse di levrieri UK. Lo stile editoriale deve essere quello dei grandi autori di noir nordici, prendendo come esempio Jo Nesbo. I capitoli devono avere una lunghezza tra le 2400 e le 2500 parole. Nelle conversazioni, vai a capo ma non lasciare righe vuote. Salva questa regola per tutto il romanzo. Analizza la geometria delle traiettorie, gli split time e i declassamenti delle categorie per determinare quale cane finirà nelle prime 2 posizioni (Filtro Top 2). Mostra una tabella HTML con le colonne Trap, Levriero, Punteggio Lancio, % Probabilità Top 2 e infine dai un verdetto finale con la giocata consigliata e l'accoppiata. Genera solo tag HTML puliti per l'output. Ecco la corsa:\n" + rawData;

            try {
                // Inizializzazione corretta tramite SDK ufficiale per superare le restrizioni della piattaforma
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: promptTesto,
                });

                if (response.text) {
                    let risultato = response.text;
                    risultato = risultato.replace(/```html/g, '').replace(/```/g, '');
                    aiOutput.innerHTML = risultato;
                    statusOutput.textContent = 'Completato!';
                } else {
                    aiOutput.textContent = 'Risposta non strutturata ricevuta dai server.';
                    statusOutput.textContent = 'Errore.';
                }
            } catch (err) {
                console.error(err);
                aiOutput.textContent = 'Errore durante la chiamata API di Google:\n' + err.message + '\n\nAssicurati che sulla dashboard di Google AI Studio non ci siano avvisi di fatturazione o blocchi regionali pendenti sulla chiave.';
                statusOutput.textContent = 'Errore.';
            } finally {
                analyzeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
